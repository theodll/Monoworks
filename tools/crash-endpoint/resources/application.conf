ktor {
  deployment {
    port = 9090
    port = ${?PORT}
  }
  application {
    modules = [
      org.monoworks.tools.RoutingKt.configureRouting
    ]
  }

  monoworks
  {
    server
    {
      reportDir = "reports/"
    }

    reports
    {
        maxZippedBytes = 104857600
        maxTotalBytes = 262144000
        maxZipEntries = 20
    }

  }


}